name: Credential release checks
on:
  pull_request:
  push:
    branches: [main, feat/credentials]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: msc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/msc_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/msc_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/msc_test
      CREDENTIAL_EMAIL_MODE: 'off'
      CREDENTIAL_STORAGE: local
      CREDENTIAL_PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client poppler-utils
      - run: npm ci
      - run: npx prisma generate
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
